name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 cap-table/safe_cap_table.py cap-table/examples/yc-example-1.json
      - run: python3 scripts/make_data_room.py --stage series-a --out /tmp/data-room
